name: DemandGuard CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install system dependencies (CBC Solver)
      run: |
        sudo apt-get update
        sudo apt-get install -y coinor-cbc

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint and Format check with Ruff
      run: |
        ruff check src tests
        ruff format --check src tests

    - name: Run Test Suite with Pytest
      run: |
        pytest tests -v --cov=src/demandguard --cov-report=term-missing

    - name: Test Docker Build
      run: |
        docker build -t demandguard:ci .

    - name: Start container and verify forecast/reorder
      run: |
        docker run -d --name demandguard-ci -p 127.0.0.1:8000:8000 demandguard:ci
        for attempt in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:8000/ready; then break; fi
          sleep 2
        done
        python scripts/smoke_api.py

    - name: Container logs and cleanup
      if: always()
      run: |
        docker logs demandguard-ci || true
        docker rm -f demandguard-ci || true
